name: Olá

on:
  workflow_dispatch:
    inputs:
      nome:
        description: "Quem você quer cumprimentar?"
        default: "Turma"

jobs:
  ola:
    runs-on: ubuntu-latest
    steps:
      - name: Saudação
        env:
          NOME: ${{ inputs.nome }}
        run: |
          echo "Olá $NOME!"
          echo "Evento: $GITHUB_EVENT_NAME"
          echo "Runner: $RUNNER_OS"
      - name: O runner tem Docker
        run: docker --version

  finalizacao:
    needs: ola
    runs-on: ubuntu-latest
    steps:
      - name: Mensagem final
        run: echo "Fim"